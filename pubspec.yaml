name: pet
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_screenutil: ^5.9.3
  flutter_lints: ^6.0.0
  intl: ^0.20.3
  clean_api_client: ^0.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Zeyada
      fonts:
        - asset: assets/fonts/Zeyada-Regular.ttf

flutter_intl:
  enabled: true